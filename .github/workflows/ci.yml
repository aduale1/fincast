name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A throwaway Postgres for this run, so we can prove the migrations apply cleanly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fincast
          POSTGRES_PASSWORD: fincast
          POSTGRES_DB: fincast
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fincast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fincast:fincast@localhost:5432/fincast

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Apply database migrations
        run: npm run db:migrate --workspace apps/api
      - run: npm run build
